name: Shikkhak Production Deployment

on:
  push:
    branches: [main]

jobs:
  deploy-app:
    name: Build & Deploy Web Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run Test Suite
        run: npm run test

      - name: Build Next.js Production Bundle
        run: npm run build
        env:
          NEXT_PUBLIC_STELLAR_NETWORK: "testnet"
          NEXT_PUBLIC_SOROBAN_RPC_URL: "https://soroban-testnet.stellar.org"
